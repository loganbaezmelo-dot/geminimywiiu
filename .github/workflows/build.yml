name: Build geminimywiiu WUHB

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Wii U dependencies
        run: |
          sudo dkp-pacman -S --needed --noconfirm \
            wiiu-dev \
            wiiu-curl

      - name: Build WUHB
        run: |
          mkdir build && cd build
          /opt/devkitpro/portlibs/wiiu/bin/powerpc-eabi-cmake ..
          make

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: geminimywiiu-build-output
          path: build/
