name: Build geminimywiiu WUHB

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Wii U dependencies
        run: |
          sudo dkp-pacman -Syu --noconfirm
          sudo dkp-pacman -S --noconfirm \
            wiiu-dev \
            wiiu-curl \
            wiiu-wuhbtool

      - name: Build WUHB
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=/opt/devkitpro/wut/share/wut.toolchain.cmake
          make geminimywiiu.wuhb

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: geminimywiiu-wuhb
          path: build/geminimywiiu.wuhb
